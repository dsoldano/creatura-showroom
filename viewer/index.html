<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site walkthrough</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <div id="sky"></div>
  <canvas id="gl"></canvas>
  <div id="labels" aria-hidden="true"></div>

  <header id="topbar">
    <div class="chip" id="titleChip"><span class="dot"></span><span id="titleText">Loading…</span></div>
    <div class="actions">
      <button class="btn" id="btnLight" title="Toggle day / dusk lighting" aria-pressed="false">Dusk</button>
      <button class="btn" id="btnReset" title="Reset view">Reset view</button>
    </div>
  </header>

  <aside id="panel" class="collapsed" aria-label="Places on the site">
    <button class="handle" id="sheetHandle" aria-label="Expand or collapse the list"><span></span></button>
    <div id="panelHome">
      <div class="tours" id="tours" role="group" aria-label="Guided tours"></div>
      <div class="facts" id="facts"></div>
      <div class="themes" id="themes" role="group" aria-label="Filter by theme"></div>
      <ol class="hotlist" id="hotlist"></ol>
    </div>
    <div id="panelDetail" hidden>
      <button class="back" id="btnBack">‹ All places</button>
      <div class="detail-head"><span class="num" id="dNum"></span><h2 id="dName"></h2></div>
      <figure class="postcard"><img id="dImg" alt=""><figcaption><span class="badge" id="dBadge"></span> <span id="dCredit"></span></figcaption></figure>
      <p class="caption" id="dCaption"></p>
      <div class="detail-actions"><button class="btn" id="btnFly">Fly here</button><button class="btn" id="btnPrev">‹ Prev</button><button class="btn" id="btnNext">Next ›</button></div>
    </div>
  </aside>

  <div id="tourbar" hidden>
    <div class="tb-text"><b id="tbName"></b><span id="tbPlace"></span></div>
    <div class="tb-bar"><i id="tbFill"></i></div>
    <button class="tb-btn" id="tbPause" aria-label="Pause">❚❚</button>
    <button class="tb-btn" id="tbExit" aria-label="Exit tour">✕</button>
  </div>
  <div id="compass" title="North"><div class="needle"><span>N</span></div></div>
  <footer id="credit">Built by <a href="https://cs.csoul.cloud" target="_blank" rel="noopener">CreatiSoul</a> · demonstration from public data</footer>

  <section id="intro" aria-live="polite">
    <div class="card">
      <div class="eyebrow">CreatiSoul demonstration</div>
      <h1 id="introName">…</h1>
      <p class="sub" id="introLoc"></p>
      <p class="disc" id="introDisc"></p>
      <button class="btn primary" id="btnExplore" disabled>Loading the site…</button>
    </div>
  </section>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
